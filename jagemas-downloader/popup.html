<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jagema's Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon48.png" alt="" class="logo">
    <div class="brand">
      <h1>Jagema's Downloader</h1>
      <div class="host" id="host"></div>
    </div>
    <button class="icon-btn" id="refresh" title="Scan the page again" aria-label="Scan again">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </header>

  <main id="list" aria-live="polite"></main>

  <div class="notice" id="notice" hidden></div>

  <footer class="bottom">
    <label class="toggle"><input type="checkbox" id="showSmall"> Show small files</label>
    <label class="toggle"><input type="checkbox" id="saveAs"> Ask where to save</label>
    <button class="link-btn" id="clear">Clear list</button>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
